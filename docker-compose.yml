# Phase 0: Postgres only. The backend and frontend services are added in Phase 6.
# These credentials are for local development only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lifts
      POSTGRES_PASSWORD: lifts
      POSTGRES_DB: lifts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifts -d lifts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
