server {
    listen 80;
    root /usr/share/nginx/html;

    # API requests go to the backend container (same job as Vite's dev proxy).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx doesn't know this file type by default
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Built JS/CSS have a content hash in their filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths like /lifts/3 serve index.html and React
    # Router takes it from there. index.html itself is never cached, so a
    # rebuild shows up on the next load.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
