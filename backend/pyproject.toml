[project]
name = "lift-tracker-backend"
version = "0.1.0"
description = "REST API for the personal lift tracker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",  # required by FastAPI's TestClient
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
